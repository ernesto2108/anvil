# Anvil - Deployment Manifest
# Deploys agents, skills, and commands to multiple AI coding tools.
#
# sync_mode:
#   - "symlink" (default): target/{component} -> repo. Edits go directly to repo.
#   - "copy": copies files. Used for agents (tier resolution) and pinned components.
#
# Component tags:
#   - "HEAD"    -> follows current branch
#   - "v1.0.0"  -> pinned to git tag (copy)
#   - "abc1234"  -> pinned to commit SHA (copy)

# Deploy targets - one per tool. Set enabled: false to skip.
targets:
  claude:
    enabled: true
    path: ~/.claude
  opencode:
    enabled: true
    path: ~/.config/opencode
  gemini:
    enabled: true
    path: ~/.gemini
  codex:
    enabled: true
    path: ~/.codex
  cursor:
    enabled: false

# Cursor deploys to specific project directories (not global).
# Uncomment and add your projects:
# cursor_projects:
#   - ~/projects/my-app
#   - ~/projects/other-app

# Components managed by anvil
# Use include/exclude to select specific agents, skills, or commands.
# include: only deploy these (whitelist). exclude: deploy all except these (blacklist).
# include takes precedence over exclude. Names without .md extension.
components:
  agents:
    tag: "HEAD"
    # include:              # Only deploy these agents
    #   - developer
    #   - tester
    #   - dba
    # exclude:              # Deploy all EXCEPT these
    #   - mkt-content
    #   - reporter
  skills:
    tag: "HEAD"
    # include:
    #   - go-conventions
    #   - react-conventions
  commands:
    tag: "HEAD"

# Files synced individually
files:
  CLAUDE.md:
    tag: "HEAD"

# Remote registries - browse and install additional agents/skills
# Each registry points to a JSON index with available entries.
# Use `anvil registry list` to browse, `anvil registry add <name>` to install.
registries:
  - name: official
    url: https://raw.githubusercontent.com/ernesto2108/anvil/main/registry.json
#   - name: team
#     url: https://raw.githubusercontent.com/myteam/anvil-agents/main/registry.json

# Local-only paths - NEVER synced, NEVER touched
# These stay in each tool's config and are not managed by anvil
ignore:
  - settings.json
  - settings.local.json
  - history.jsonl
  - sessions/
  - projects/
  - plugins/
  - session-env/
  - shell-snapshots/
  - cache/
  - debug/
  - downloads/
  - file-history/
  - paste-cache/
  - plans/
  - ide/
  - backups/
  - hooks/
  - stats-cache.json
  - mcp-needs-auth-cache.json
  - project-registry.md
  - .workspace/
  - .claude/
