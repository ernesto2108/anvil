nodes:
  - id: pm
    role: pm
    timeout: 5m
  - id: arch
    role: architect
    depends_on: [pm]
    gate: true
    timeout: 5m
  - id: dev
    role: developer
    depends_on: [arch]
    on_fail: retry
    timeout: 10m
  - id: qa
    role: qa
    depends_on: [dev]
    gate: true
    timeout: 5m
