nodes:
  - id: pm
    role: pm
    timeout: 5m
  - id: arch
    role: architect
    depends_on: [pm]
    gate: true
    timeout: 5m
  - id: dev
    # Resolver al developer del stack de la tarea: developer-backend | developer-frontend | developer-mobile
    role: developer-backend
    depends_on: [arch]
    on_fail: retry
    timeout: 10m
  - id: qa
    role: qa
    depends_on: [dev]
    gate: true
    timeout: 5m
