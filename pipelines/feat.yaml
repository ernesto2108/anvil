# Standard feature — architect (SPEC) + dev + tester + qa
nodes:
  - id: arch
    role: architect
    timeout: 5m
    outputs: [architecture.md, spec.md, adrs/]
  - id: spec-approval
    role: gate
    depends_on: [arch]
    description: User approves SPEC before developer starts
  - id: dev
    # Resolver al developer del stack de la tarea: developer-backend | developer-frontend | developer-mobile
    role: developer-backend
    depends_on: [spec-approval]
    timeout: 10m
    inputs: [spec.md]
  - id: test
    role: tester
    depends_on: [dev]
    timeout: 5m
  - id: qa
    role: qa
    depends_on: [test]
    gate: true
    timeout: 5m
