# Standard feature — architect + dev + tester + qa
nodes:
  - id: arch
    role: architect
    timeout: 5m
  - id: dev
    role: developer
    depends_on: [arch]
    timeout: 10m
  - id: test
    role: tester
    depends_on: [dev]
    timeout: 5m
  - id: qa
    role: qa
    depends_on: [test]
    gate: true
    timeout: 5m
