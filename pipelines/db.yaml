# Database change — dba + dev + tester
# Covers relational (migrations), Redis (keyspace), vector (collections),
# document (schema evolution), messaging (schema registry), search (mappings)
nodes:
  - id: dba
    role: dba
    gate: true
    timeout: 5m
    outputs: [migrations/, keyspace-conventions.md, schema.avsc]
  - id: dev
    # Cambios de DB suelen integrarse en backend Go; resolver al stack real si difiere
    role: developer-backend
    depends_on: [dba]
    timeout: 10m
  - id: test
    role: tester
    depends_on: [dev]
    timeout: 5m
