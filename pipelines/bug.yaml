# Bug fix — dev + tester + qa review
nodes:
  - id: dev
    # Resolver al developer del stack de la tarea: developer-backend | developer-frontend | developer-mobile
    role: developer-backend
    timeout: 10m
  - id: test
    role: tester
    depends_on: [dev]
    timeout: 5m
  - id: qa
    role: qa
    depends_on: [test]
    gate: true
    timeout: 5m
