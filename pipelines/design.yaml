# Feature with UI/UX — designer (DTD) + architect + dev + tester + qa
# DTD is a blocking artifact for the architect when the task involves UI
nodes:
  - id: designer
    role: designer
    gate: true
    timeout: 5m
    outputs: [dtd.md]
  - id: arch
    role: architect
    depends_on: [designer]
    timeout: 5m
    outputs: [architecture.md, spec.md]
  - id: dev
    # Pipeline UI/UX → developer-frontend por defecto; usar developer-mobile si el target es Flutter
    role: developer-frontend
    depends_on: [arch]
    timeout: 10m
  - id: test
    role: tester
    depends_on: [dev]
    timeout: 5m
  - id: qa
    role: qa
    depends_on: [test]
    gate: true
    timeout: 5m
