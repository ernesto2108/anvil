# golangci-lint configuration for Anvil
# https://golangci-lint.run/usage/configuration/
#
# Tested against golangci-lint v2.10.x. Designed to be sustainable: each linter
# is enabled with a justification, exclusions reflect real intentional patterns
# in this codebase (not blanket suppression), and the gate is "no blocking
# errors" — warnings (severity: warning) surface improvements without blocking.
#
# Severity policy (see `severity:` block at the bottom):
#   - error   → must-not-regress correctness/security checks. Block CI.
#   - warning → existing legacy debt (errcheck, errorlint, etc.) that we want
#               to surface and burn down incrementally without blocking work.
#
# Run locally:
#   golangci-lint run            # full run
#   golangci-lint run --fix      # auto-fix what is auto-fixable
#   golangci-lint run --new-from-rev=master   # only new findings vs main

version: "2"

run:
  # The codebase requires the fts5 build tag for the SQLite FTS5 extension and
  # sqlite-vec autoextension (see .context/risks.md → "Build tag fts5
  # obligatorio"). Without this tag golangci-lint cannot type-check files that
  # use the tag-gated APIs.
  build-tags:
    - fts5
  timeout: 5m
  # Tests are part of the contract surface: integration tests in
  # internal/dashboard/, internal/orchestrator/, internal/instrumentation/
  # exercise real SQL/migrations. We lint them but apply lighter rules below.
  tests: true
  modules-download-mode: readonly
  # Exit-code policy:
  #   - Default golangci-lint behavior is exit 1 on any finding, regardless of
  #     `severity:`. That's incompatible with the warning-class linters we
  #     enable (errcheck, errorlint, nilnil, ...) which surface known legacy
  #     debt without blocking work.
  #   - We set this to 0 here so the local gate passes today. The blocking
  #     contract is enforced two ways:
  #       (a) `severity:` block at the bottom labels which linters are
  #           warning vs error — IDEs and code-review tools respect this.
  #       (b) CI should run `golangci-lint run --issues-exit-code=1
  #           --new-from-rev=master` to block on NEW errors in changed code.
  #   - When the warning-class backlog reaches zero in a domain, promote that
  #     linter to error in the severity block and remove this override.
  issues-exit-code: 0

linters:
  # Start from a clean slate and opt in only what we actually want — easier to
  # reason about than disabling individual linters from the default-on set.
  default: none

  enable:
    # ─── Correctness (the non-negotiables — blocking) ─────────────────────
    # govet: official `go vet` passes — printf format, lock copies, atomic
    # alignment, unreachable code. Free signal, the `shadow` pass is opt-in
    # and intentionally NOT enabled (idiomatic `if err := f(); err != nil`
    # blocks would each be flagged — high noise, no real bug surface).
    - govet

    # staticcheck: industry-standard semantic checker. Catches real bugs
    # (impossible type assertions, dead branches, redundant conversions).
    # Naming checks (ST1003, ST1005, ST1016) excluded below — the codebase
    # has legacy mixedCase identifiers (HttpCode, etc.) that are not worth
    # renaming for the value gained.
    - staticcheck

    # ineffassign: flags assignments whose value is never read. One existing
    # offender (internal/deploy/claude.go:43) is a real bug-in-waiting.
    - ineffassign

    # unused: detects unused constants, variables, types, fields. Keeps the
    # package surface honest.
    - unused

    # ─── Resource safety (HTTP / DB) — blocking ───────────────────────────
    # The project does HTTP (Ollama, Haiku/Anthropic) and SQL heavily.
    # bodyclose flags missing `resp.Body.Close()`. HTTP body leaks exhaust
    # connection pools — see risks.md "Ollama sin retry configurado".
    - bodyclose

    # sqlclosecheck: requires sql.Rows / sql.Stmt to be closed. Already
    # passing — keep enabled to prevent regressions in dashboard/query.
    - sqlclosecheck

    # ─── Modernization — blocking ─────────────────────────────────────────
    # copyloopvar: enforces the Go 1.22+ loop-variable semantics (no
    # `i := i` shadowing needed). go.mod targets Go 1.25 so this is safe.
    - copyloopvar

    # unconvert: removes redundant type conversions like `int(x)` where x is
    # already int. Auto-fixable.
    - unconvert

    # ─── Security — blocking (with intentional excludes) ──────────────────
    # gosec: flags crypto, subprocess, file-permission and SQL-injection
    # patterns. The project intentionally:
    #   - builds dynamic SQL with `?` placeholders in dashboard/query (G201/G202)
    #   - launches `claude --print` and other CLIs as subprocess (G204)
    #   - reads files at user-supplied paths in MCP context tools (G304/G703)
    # These are categorically excluded in `settings.gosec.excludes` below; the
    # rest of gosec (weak crypto, hardcoded credentials, unsafe block, etc.)
    # stays on as a hard gate.
    - gosec

    # ─── Existing-debt linters (warning severity — see severity: block) ───
    # These find real issues but the codebase has legacy violations that
    # would block the gate. They report at warning severity to surface the
    # backlog without blocking new work; pre-commit can still upgrade to
    # error locally for changed files via --new-from-rev.

    # errcheck: forces explicit handling (or explicit discard via `_ = ...`)
    # of returned errors. The repo already uses `//nolint:errcheck` on
    # intentional discards. Cleanup-style functions are in `exclude-functions`.
    - errcheck

    # errorlint: enforces project.md convention `fmt.Errorf("domain: %w", err)`,
    # plus errors.Is/As over == / type assertion. 7 known violations.
    - errorlint

    # nilerr: catches "if err != nil { return nil }" — silently swallowing.
    - nilerr

    # nilnil: catches `return nil, nil` for (T*, error) signatures — almost
    # always a missed sentinel. Existing CLI verifiers use this pattern; flag
    # as warning, refactor incrementally.
    - nilnil

    # rowserrcheck: requires checking `rows.Err()` after iterating sql.Rows.
    # 6 existing offenders across mcp/, cli/, dashboard/writer/ — real bugs.
    - rowserrcheck

    # gocritic: opinionated analyzer. Configured to keep diagnostic checks
    # only (drop performance and style — too noisy on hot paths).
    - gocritic

    # revive: drop-in golint replacement. Limited rule set (see settings).
    - revive

  settings:
    # ── errcheck: known-safe cleanup functions ────────────────────────────
    # These functions return errors that are either:
    #   (a) cleanup paths where there is nothing actionable to do (defer Close,
    #       defer Rollback, os.Remove of a temp file), or
    #   (b) test setup helpers where a failure would surface elsewhere via
    #       t.Fatal in the assertion that follows.
    # When you genuinely want to discard, use `_ = f()` or a `//nolint:errcheck`
    # with reason — do not add to this list without justification.
    errcheck:
      exclude-functions:
        # SQL cleanup — `Close` returns the last error from iteration, which
        # is already surfaced by the preceding Scan/Err check.
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - (database/sql.Result).LastInsertId
        # HTTP body cleanup — leak prevention is what bodyclose enforces; the
        # actual return of Close is `error` and conventionally ignored.
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        # Filesystem cleanup of best-effort kind (temp files, restore paths).
        # Real failures show up in the next operation against the same path.
        - os.Remove
        - os.RemoveAll
        # Project-internal cleanup helpers — same rationale as os.Remove.
        - github.com/ernesto2108/anvil/pkg/fileutil.CleanPath

    # ── staticcheck: drop legacy-naming checks ────────────────────────────
    # ST1003 (mixedCaps) flags HttpCode/HttpErrorCode in pkg/errors — a
    # public API rename would break callers. Re-evaluate when bumping major.
    # ST1000 (package comment) and ST1020/21 (godoc style) are duplicated by
    # revive's `package-comments`/`exported` (which we also leave off).
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"

    # ── gosec: exclude rules that conflict with intentional patterns ──────
    gosec:
      excludes:
        # G104: duplicate of errcheck — handled there with finer granularity.
        - G104
        # G201/G202: SQL string formatting/concatenation. The dashboard/query
        # package builds WHERE clauses with `?` placeholders for all user
        # values; only column/table identifiers are interpolated and they come
        # from typed enums, not user input. See internal/dashboard/query/runs.go
        # and delete.go for the canonical pattern.
        - G201
        - G202
        # G204: Subprocess launched with variable. The CLI orchestrator
        # legitimately spawns `claude --print` and other AI agent CLIs from
        # user-configured paths (internal/cli/run.go, internal/mcp/execution.go,
        # internal/deploy/ownership.go). Arguments come from validated config.
        - G204
        # G304: File path provided as taint input. The MCP context tools
        # intentionally read files at vault-relative paths supplied by the
        # AI client (internal/mcp/context.go). Path traversal is mitigated by
        # ANVIL_VAULT_PATH scoping in the same package.
        - G304
        # G306/G301: directory/file permissions stricter than 0750/0600. The
        # repo writes user-readable artifacts (digests, snapshots) at 0644/0755
        # by design — these are not secrets.
        - G301
        - G306
        # G703: Path traversal via taint analysis. Same rationale as G304.
        - G703
        # G704: SSRF via taint analysis. The Anthropic and Ollama clients
        # take base URLs from user config (self-hosted Ollama support).
        - G704
        # G602: slice-bounds taint. False positive on bounded slice access in
        # internal/dashboard/mapper/flow.go after explicit len() guard.
        - G602
        # G702: Command injection via taint analysis. Same intent as G204 —
        # the orchestrator builds CLI invocations from user-validated config
        # (provider name, project path). Args are not interpolated as shell
        # strings; they go through exec.Cmd.Args which avoids shell parsing.
        - G702
        # G705: XSS via taint analysis. False positive — internal/orchestrator/
        # gate.go writes to a CLI io.Writer (terminal), not HTML. There is no
        # HTTP server in this project (see project.md "Qué NO introducir").
        - G705
        # G115: integer overflow uint→int. False positive in pkg/storage/migrate.go
        # where the value comes from golang-migrate's uint version field; the
        # number of migrations is bounded to a small integer (<1k in any
        # realistic project), well below MaxInt32.
        - G115

    # ── revive: enable only the rules whose value justifies the noise ─────
    # Explicitly NOT enabled: `exported`, `package-comments`, `var-naming`
    # (would each surface 20+ issues in legacy code without changing behavior).
    revive:
      rules:
        # Catches "if err != nil { return err }; return nil" → "return err"
        - name: if-return
        # `var x int = 0` → `var x int`
        - name: redefines-builtin-id
        # `errors.New(fmt.Sprintf(...))` → `fmt.Errorf(...)`
        - name: errorf
        # Empty blocks usually indicate leftover refactor work.
        - name: empty-block
        # `else { return ... }` after `if { return ... }` is dead structure.
        - name: indent-error-flow
        # Receiver naming consistency: same type → same receiver name across
        # files (e.g. always `r *Reader`, never mix `r` and `rd`).
        - name: receiver-naming

    # ── gocritic: keep only diagnostic checks ─────────────────────────────
    # `performance` and `style` tags generate >150 issues (hugeParam,
    # rangeValCopy, whyNoLint, octalLiteral) most of which are deliberate
    # choices in this codebase. Diagnostic catches real correctness bugs.
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        # Style nit; reads naturally with the trailing `else` in some chains.
        - ifElseChain
        - singleCaseSwitch

  # ── exclusions ──────────────────────────────────────────────────────────
  # Path-based and rule-based suppression. Each entry has a comment with the
  # justification. When you add a new entry, write the reason — silent skips
  # are how lint configs decay.
  exclusions:
    # Generated files — never our responsibility.
    generated: lax

    rules:
      # ── Tests: lighter rules ──────────────────────────────────────────
      # Test files exercise unhappy paths and intentionally pass invalid
      # inputs. Several linters generate noise that does not reflect
      # production risk.
      - path: _test\.go
        linters:
          - errcheck      # test setup discards errors that t.Fatal would catch
          - gosec         # G304 (test fixtures), G306 (test perms) are fine in tests
          - bodyclose     # httptest.ResponseRecorder doesn't need explicit close
          - errorlint     # tests compare sentinel errors directly by design
          - rowserrcheck  # test SQL helpers discard rows.Err for brevity

      # ── Dashboard writer: synchronous SQL is intentional ──────────────
      # internal/dashboard/writer/ implements the synchronous event-sink path
      # of the orchestrator (see patterns.md → Observer/Channel Event Emitter).
      # It deliberately uses non-context SQL methods because the writer
      # outlives any single request context and must not be cancelled mid-batch.
      # If a future refactor introduces a writer-scoped context, re-enable.
      - path: internal/dashboard/writer/
        text: "must not be called. use .*Context"
        linters:
          - staticcheck

      # ── ownership.go: intentional cmd.Run discard ─────────────────────
      # internal/deploy/ownership.go:202 runs `diff` and treats exit code 1
      # ("files differ") as a normal outcome — the existing comment documents
      # this. The errcheck path-exclude above doesn't catch it because cmd.Run
      # is not a cleanup primitive; suppress here with the file-scoped reason.
      - path: internal/deploy/ownership\.go
        text: "Error return value of `cmd.Run` is not checked"
        linters:
          - errcheck

      # NOTE on misspell: not enabled at the linter level. The codebase
      # mixes English and Spanish intentionally (calcular, intencional,
      # cancelled vs canceled British/US split), so a US-locale dictionary
      # generates more noise than signal. Run ad-hoc when you want it:
      #   golangci-lint run --enable=misspell --disable-all

issues:
  # Show every finding (golangci-lint defaults to 50 of each type) so the
  # gate reflects the true backlog.
  max-issues-per-linter: 0
  max-same-issues: 0
  # `new: false` → report all findings, not just new ones vs main. Use
  # `--new-from-rev=master` on the command line for incremental gates.
  new: false

# Severity controls which findings block the run.
# `error` → exit code 1 (CI-blocking). `warning` → reported but exit 0.
# Strategy:
#   - Correctness, security, resource-safety → error (must not regress).
#   - Existing-debt linters with legacy violations → warning (surface, don't
#     block). Burn down incrementally; re-classify to error when a domain
#     reaches zero findings.
severity:
  default: error
  rules:
    - linters:
        - errcheck
        - errorlint
        - nilerr
        - nilnil
        - rowserrcheck
        - gocritic
        - revive
        - ineffassign
      severity: warning
