<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" font-family="'SF Mono','Fira Code','Cascadia Code',Menlo,Monaco,Consolas,monospace" font-size="13">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <!-- Window -->
  <rect width="720" height="480" rx="10" fill="#1c1c1e"/>
  <!-- Title bar -->
  <rect width="720" height="32" rx="10" fill="url(#titlebar)"/>
  <rect y="22" width="720" height="10" fill="url(#titlebar)"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="360" y="21" fill="#98989d" text-anchor="middle" font-size="12">anvil browse</text>

  <!-- Header -->
  <text x="20" y="60" fill="#bf5af2" font-weight="bold" font-size="14">Anvil Browse</text>
  <text x="140" y="60" fill="#636366" font-size="11">main @ 66d84b0 · provider: claude</text>

  <!-- Tab bar -->
  <rect x="20" y="72" width="80" height="24" rx="4" fill="#6366f1"/>
  <text x="60" y="88" fill="#fff" text-anchor="middle" font-size="11" font-weight="bold">Agents</text>
  <text x="130" y="88" fill="#636366" font-size="11">Skills</text>
  <text x="200" y="88" fill="#636366" font-size="11">Commands</text>

  <!-- Search -->
  <rect x="20" y="104" width="680" height="24" rx="4" fill="#2c2c2e" stroke="#48484a" stroke-width="1"/>
  <text x="32" y="120" fill="#636366" font-size="11">/ Search agents...</text>

  <!-- Column headers -->
  <text x="46" y="148" fill="#48484a" font-size="11">NAME</text>
  <text x="200" y="148" fill="#48484a" font-size="11">DESCRIPTION</text>
  <text x="530" y="148" fill="#48484a" font-size="11">TIER</text>
  <text x="590" y="148" fill="#48484a" font-size="11">TARGETS</text>

  <!-- Selected row -->
  <rect x="14" y="154" width="692" height="26" rx="4" fill="#6366f1" opacity="0.15"/>
  <text x="20" y="172" fill="#6366f1" font-size="13">▸</text>
  <text x="46" y="172" fill="#fff" font-weight="bold">architect</text>
  <text x="200" y="172" fill="#d1d1d6" font-size="12">System design, API contracts, ADRs</text>
  <text x="530" y="172" fill="#ffd60a" font-size="11">high</text>
  <text x="590" y="172" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <!-- Rows -->
  <text x="46" y="198" fill="#e5e5ea">dba</text>
  <text x="200" y="198" fill="#98989d" font-size="12">Migrations, schema, query optimization</text>
  <text x="530" y="198" fill="#64d2ff" font-size="11">medium</text>
  <text x="590" y="198" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="224" fill="#e5e5ea">designer</text>
  <text x="200" y="224" fill="#98989d" font-size="12">UX/UI design, design system, user flows</text>
  <text x="530" y="224" fill="#ffd60a" font-size="11">high</text>
  <text x="590" y="224" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="250" fill="#e5e5ea">developer</text>
  <text x="200" y="250" fill="#98989d" font-size="12">Production code across all stacks</text>
  <text x="530" y="250" fill="#64d2ff" font-size="11">medium</text>
  <text x="590" y="250" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="276" fill="#e5e5ea">devops</text>
  <text x="200" y="276" fill="#98989d" font-size="12">CI/CD, Docker, Terraform, K8s</text>
  <text x="530" y="276" fill="#64d2ff" font-size="11">medium</text>
  <text x="590" y="276" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="302" fill="#e5e5ea">pm</text>
  <text x="200" y="302" fill="#98989d" font-size="12">Requirements, PRDs, backlog, sprints</text>
  <text x="530" y="302" fill="#ffd60a" font-size="11">high</text>
  <text x="590" y="302" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="328" fill="#e5e5ea">qa</text>
  <text x="200" y="328" fill="#98989d" font-size="12">Code review, quality gate (score >= 7)</text>
  <text x="530" y="328" fill="#64d2ff" font-size="11">medium</text>
  <text x="590" y="328" fill="#30d158" font-size="11">● ● ● ● ●</text>

  <text x="46" y="354" fill="#636366">↓ 6 more...</text>

  <!-- Footer -->
  <rect x="0" y="448" width="720" height="32" rx="0" fill="#2c2c2e"/>
  <text x="20" y="468" fill="#98989d" font-size="11">↑↓ navigate</text>
  <text x="130" y="468" fill="#98989d" font-size="11">tab switch view</text>
  <text x="270" y="468" fill="#98989d" font-size="11">enter install</text>
  <text x="390" y="468" fill="#98989d" font-size="11">d uninstall</text>
  <text x="490" y="468" fill="#98989d" font-size="11">t toggle target</text>
  <text x="620" y="468" fill="#98989d" font-size="11">q quit</text>
</svg>