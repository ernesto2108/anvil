# anvil.config.yaml - Provider & permission configuration
# Agents no longer declare a model tier in their frontmatter; each tool uses
# its own session default model. Agents still define permissions
# (read/write/execute), resolved to actual tool names per target at deploy
# time.
#
# Usage:
#   anvil provider              # show current
#   anvil provider gemini       # switch + redeploy agents
#   anvil deploy                # full deploy with current provider

# Active provider
provider: claude

# Known provider names, used to validate `anvil provider <name>` and the
# switch_provider MCP tool. No model mapping — each tool uses its session
# default model.
providers:
  - claude
  - opencode
  - codex
  - cursor
  - gemini
  - local

# Permission to tool names per tool
# Agents define permission: read | write | execute
# Deploy resolves to the actual tool names each platform uses
permissions:
  claude:
    read: Glob, Grep, LS, Read
    write: Glob, Grep, LS, Read, Write, Edit
    execute: Glob, Grep, LS, Read, Write, Edit, Bash, Skill
  opencode:
    read: read
    write: write
    execute: execute
  gemini:
    read: read_file, list_directory, search_files
    write: read_file, list_directory, search_files, write_file, edit_file
    execute: read_file, list_directory, search_files, write_file, edit_file, run_shell_command
  cursor:
    read: read_file, list_dir, grep_search, file_search
    write: read_file, list_dir, grep_search, file_search, edit_file, create_file
    execute: read_file, list_dir, grep_search, file_search, edit_file, create_file, run_terminal_command
